name: Daily Drive

on:
  schedule:
    - cron: '0 19 * * *'   # 5am AEDT (UTC+10)
    - cron: '0 6 * * *'    # 4pm AEDT (UTC+10)
  workflow_dispatch:         # lets you trigger manually from GitHub

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Write Spotify token
        run: echo '${{ secrets.SPOTIFY_TOKEN_JSON }}' > .spotify-token.json    

      - name: Write config
        run: |
          sed -i "s/your-client-id-here/$SPOTIFY_CLIENT_ID/g" config.yaml
          sed -i "s/your-client-secret-here/$SPOTIFY_CLIENT_SECRET/g" config.yaml
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      
      - name: Generate AI Intro
        run: node generate-intro.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}

      - name: Commit updated intro to GitHub Pages
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add podcast/intro.mp3 podcast/feed.xml
          git diff --staged --quiet || git commit -m "Auto-update daily intro $(date +%Y-%m-%d)"
          git push

      - name: Run Daily Drive
        run: node index.js
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
